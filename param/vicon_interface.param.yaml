/**:
  ros__parameters:
    # vicon_tracker_ip: "10.42.0.52"
    # vicon_tracker_ip: "192.168.3.137"
    # vicon_tracker_ip: "192.168.137.1"
    vicon_tracker_ip: "192.168.10.1"
    # vicon_object_name: "lecar_wand"
    # vicon_object_name: "lecar_car_car"
    # vicon_object_name: "lecar_car_car_small"
    # vicon_object_name: "lecar"
    vicon_object_names: ["g1", "box"]
    # vicon_object_names: ["tron1"]
    # vicon_object_names: ["tron1", "slide_object"]
    # vicon_object_names: ["tron1", "slide_object_small"]
    parent_frame_id: "map"
    child_frame_ids: ["g1/base_link", "box/base_link"]
    # child_frame_ids: ["tron1/base_link"]
    # child_frame_ids: ["tron1/base_link", "slide_object/base_link"]
    # child_frame_ids: ["tron1/base_link", "slide_object_small/base_link"]

    # (T_marker->child): the child origin in marker coordinates, and the child
    # orientation as sxyz Euler angles in degrees.
    #   p_child_world = p_marker_world + R_marker_world * child_frame_offset_xyz
    #   R_child_world = R_marker_world * R(child_frame_offset_rpy_deg)
    # Three entries per object, in vicon_object_names order (ROS 2 parameter cannot nest arrays).
    #
    #                         |----------- g1 -----------|  |----------- box -----------|
    child_frame_offset_xyz:    [0.0, 0.0, -0.266,          0.0, 0.0, -0.532]
    child_frame_offset_rpy_deg: [0.0, 0.0, 180.0,          0.0, 0.0, 180.536]
    poll_vicon_dt: 0.004 # 0.01
    filtered_odom_dt: 0.004 # 0.01

    # Kalman filter behind odometry/filtered/<obj>: world-frame constant acceleration, state (p, v, a)
    # per axis, white jerk, position-only measurement. Stepped once per Vicon frame by the Vicon clock
    # (frame number / frame rate); the timer only predicts the latest state to its publish time.
    # Bandwidth f_n = (q_j / (R * T))^(1/6) / (2 pi), T the frame period: about 10 Hz at 250 Hz here.
    kf_jerk_psd: [10.0, 10.0, 10.0]                   # m^2/s^5 per axis: white-jerk spectral density q_j
    kf_measurement_noise: [4.0e-8, 4.0e-8, 4.0e-8]    # m^2 per axis: (0.2 mm)^2, child-frame position noise R
    kf_initial_covariance: [4.0e-8, 4.0e-8, 4.0e-8,   # m^2 after a reset: p starts at the frame
                            1.0, 1.0, 1.0,            # (m/s)^2 after a reset: v starts at 0
                            25.0, 25.0, 25.0]         # (m/s^2)^2 after a reset: a starts at 0
    kf_max_delay: 0.02              # s: cap on the prediction from the last fused frame to the publish time
    kf_clock_window: 2.0            # s: window of the minimum host-minus-Vicon clock offset
    vicon_offline_timeout: 0.1      # s without a frame: object offline, odometry/filtered paused, reset on return
    vicon_online_jitter_time: 0.0   # s after return before odometry/filtered resumes; the clean-window rule already waits

    # TODO: make following parameters per object (as a list)
    rolling_window_size: 5
    min_states: [-.inf, -.inf, -.inf, # px, py, pz
                -.inf, -.inf, -.inf, # roll, pitch, yaw
                -.inf, -.inf, -.inf, # vx, vy, vz (body frame)
                -.inf, -.inf, -.inf,] # v_roll, v_pitch, v_yaw (body frame)
    max_states: [.inf, .inf, .inf, # px, py, pz
                .inf, .inf, .inf, # roll, pitch, yaw
                .inf, .inf, .inf, # vx, vy, vz (body frame)
                .inf, .inf, .inf,] # v_roll, v_pitch, v_yaw (body frame)
    publish_tf: true
